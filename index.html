<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire</title>
  </head>
  <body>
    <form action="/traitement" method="post" enctype="multipart/form-data">
      <!-- section 1 -->
      <fieldset>
        <legend>Identité & Sécurité</legend>

        <!-- hidden -->
        <input type="hidden" name="source" value="inscription_web" />

        <!-- prénom et nom -->
        <label for="prenom">Votre prénom* :</label>
        <input type="text" name="prenom" id="prenom" required autofocus />

        <label for="nom">Votre nom* :</label>
        <input type="text" name="nom" id="nom" placeholder="DUPONT" required />

        <!-- password -->
        <label for="mdp">Votre mot de passe :</label>
        <input
          type="password"
          name="motdepasse"
          id="mdp"
          minlength="8"
          required
        />

        <!-- fichier -->
        <label for="fichier">Envoyer votre photo de profil :</label>
        <input type="file" name="fichier" id="fichier" accept=".jpg,.png" />
      </fieldset>

      <!-- section 2 -->
      <fieldset>
        <legend>Contact & Profil</legend>

        <!-- email -->
        <label for="email">Email pro :</label>
        <input type="email" id="email" name="email" required />

        <!-- phone -->
        <label for="telephone">Téléphone :</label>
        <input
          type="tel"
          id="telephone"
          name="telephone"
          pattern="[0-9]{10}"
          required
        />

        <!-- URL -->
        <label for="site">Site web / Portfolio :</label>
        <input type="url" name="site" id="site" />

        <!-- couleur -->
        <label for="couleur">Couleur du thème :</label>
        <input type="color" id="couleur" name="couleur" value="#008000" />
      </fieldset>

      <!-- section 3 -->
      <fieldset>
        <legend>Informations professionnelles</legend>

        <!-- experience -->
        <label for="experience">Années d'expérience :</label>
        <input
          type="number"
          id="experience"
          name="experience"
          min="0"
          max="50"
        />

        <!-- TJM -->
        <label for="tjm">Taux Journalier Moyen (TJM) en € :</label>
        <input type="number" id="tjm" name="tjm" min="0" step="50" />

        <!-- seniority -->
        <label for="seniority">Niveau de séniorité estimé :</label>
        <input
          type="range"
          id="seniority"
          name="seniority"
          min="1"
          max="5"
          value="3"
        />

        <!-- languages -->
        <p>Langages maîtrisés :</p>
        <input
          type="checkbox"
          name="langages[]"
          id="angl"
          value="anglais"
          checked
        />
        <label for="angl">anglais</label>

        <input type="checkbox" name="langages[]" id="fr" value="français" />
        <label for="fr">français</label>

        <input type="checkbox" name="langages[]" id="esp" value="espagnol" />
        <label for="esp">espagnol</label>

        <input type="checkbox" name="langages[]" id="ukr" value="ukrainien" />
        <label for="ukr">ukrainien</label>

        <!-- Statut juridique -->
        <div>
          <p>Statut juridique :</p>
          <input
            type="radio"
            name="statut"
            id="auto"
            value="Auto-entrepreneur"
            checked="checked"
          />
          <label for="auto">Auto-entrepreneur</label>

          <input type="radio" name="statut" id="sasu" value="SASU" />
          <label for="sasu">SASU</label>

          <input type="radio" name="statut" id="eurl" value="EURL" />
          <label for="eurl">EURL</label>
        </div>

        <!-- Région d'intervention -->
        <label for="region">Région d'intervention :</label>
        <select name="region" id="region">
          <optgroup label="Groupe Nord">
            <option value="Hauts-de-France">Hauts-de-France</option>
            <option value="Normandie">Normandie</option>
            <option value="Île-de-France">Île-de-France</option>
          </optgroup>

          <optgroup label="Groupe Sud">
            <option value="Occitanie">Occitanie</option>
            <option value="Provence-Alpes-Côte d'Azur">
              Provence-Alpes-Côte d'Azur
            </option>
            <option value="Nouvelle-Aquitaine">Nouvelle-Aquitaine</option>
          </optgroup>
        </select>
      </fieldset>

      <!-- section4 -->

      <fieldset>
        <legend>Disponibilités & Finalisation</legend>

        <!-- date -->
        <label for="date">Date de disponibilité* :</label>
        <input type="date" name="date" id="date" required />

        <!-- audit -->
        <label for="audit">Dernier audit technique :</label>
        <input
          type="text"
          id="audit"
          name="audit"
          value="Non réalisé"
          readonly
        />

        <!-- motivation -->
        <label for="motivation">Motivation :</label>
        <textarea
          name="motivation"
          id="motivation"
          rows="8"
          cols="40"
          maxlength="500"
        ></textarea>

        <!-- CGU -->
        <label for="cgu"
          >J'accepte les conditions générales d'utilisation*</label
        >
        <input type="checkbox" id="cgu" name="cgu" required />

        <!-- Les boutons -->
        <button type="submit">Soumettre le formulaire</button>
        <button type="reset">Effacer le formulaire</button>
      </fieldset>
    </form>
  </body>
</html>
